[package]
name = "soonest"
version = "0.1.0"
description = "Soonest — The Meme Coin Ministry Desk"
authors = ["Richy Soonak"]
edition = "2021"

[lib]
name = "soonest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
